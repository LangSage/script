<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Тренажер слов и фраз</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7f2;
      --panel: rgba(255,255,255,.88);
      --card: #ffffff;
      --soft: #f1f5ed;
      --soft-2: #fff5e8;
      --text: #17201d;
      --muted: #66726b;
      --line: rgba(23,32,29,.12);
      --teal: #1e8f7a;
      --teal-soft: #dff4ee;
      --coral: #d86c53;
      --coral-soft: #ffe5dd;
      --gold: #b8860b;
      --gold-soft: #fff1c7;
      --ink-soft: #eef1f4;
      --shadow: 0 14px 34px rgba(31, 42, 36, .09);
      --ok: #138a4d;
      --bad: #bd3d2a;
    }
    [data-theme="dark"] {
      --bg: #101513;
      --panel: rgba(22,30,27,.9);
      --card: #17201d;
      --soft: #1c2824;
      --soft-2: #2a241e;
      --text: #eef7f2;
      --muted: #a7b6ad;
      --line: rgba(238,247,242,.13);
      --teal: #71dcc6;
      --teal-soft: rgba(113,220,198,.15);
      --coral: #ff987d;
      --coral-soft: rgba(255,152,125,.16);
      --gold: #ffd36b;
      --gold-soft: rgba(255,211,107,.15);
      --ink-soft: #202b28;
      --shadow: 0 16px 38px rgba(0,0,0,.28);
      --ok: #68d391;
      --bad: #ff8a78;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    }
    button, input {
      font: inherit;
    }
    .wrap {
      width: min(100%, 980px);
      margin: 0 auto;
      padding: 12px 12px 36px;
    }
    .top {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      gap: 12px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    .topline {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 10px;
    }
    .back, .iconbtn, .action {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      border-radius: 14px;
      min-height: 42px;
      cursor: pointer;
      text-decoration: none;
      display: inline-grid;
      place-items: center;
      font-weight: 800;
    }
    .back {
      min-width: 42px;
      padding: 0 12px;
    }
    .iconbtn {
      min-width: 42px;
      padding: 0 10px;
    }
    .action {
      padding: 0 14px;
      background: var(--teal);
      border-color: transparent;
      color: white;
    }
    [data-theme="dark"] .action {
      color: #07110e;
    }
    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.15;
      letter-spacing: 0;
    }
    .subline {
      margin-top: 2px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.35;
    }
    .seg {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 1px;
      scrollbar-width: none;
    }
    .seg::-webkit-scrollbar { display: none; }
    .seg button {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      border-radius: 999px;
      padding: 9px 12px;
      min-height: 40px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }
    .seg button.active {
      background: var(--teal);
      color: white;
      border-color: transparent;
    }
    [data-theme="dark"] .seg button.active {
      color: #07110e;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 12px 0;
    }
    .stat {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 10px 12px;
      min-height: 62px;
    }
    .stat b {
      display: block;
      font-size: 18px;
      line-height: 1.15;
    }
    .stat span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }
    .trainer {
      display: grid;
      gap: 12px;
      margin-top: 12px;
    }
    .quiz {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .quiz-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 14px;
      border-bottom: 1px solid var(--line);
      background: var(--soft);
    }
    .level-name {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0;
    }
    .prompt {
      margin: 4px 0 0;
      font-size: 24px;
      line-height: 1.25;
      font-weight: 900;
      word-break: break-word;
    }
    .listen {
      width: 46px;
      height: 46px;
      border-radius: 15px;
      border: 0;
      background: var(--coral);
      color: #fff;
      font-size: 18px;
      cursor: pointer;
    }
    .quiz-body {
      display: grid;
      gap: 12px;
      padding: 14px;
    }
    .task {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
      min-height: 20px;
    }
    .options {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .option {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      border-radius: 16px;
      min-height: 58px;
      padding: 12px;
      text-align: left;
      cursor: pointer;
      font-weight: 800;
      line-height: 1.25;
      word-break: break-word;
    }
    .option:hover, .word-chip:hover, .bank-word:hover {
      border-color: var(--teal);
    }
    .option.correct {
      border-color: transparent;
      background: var(--teal-soft);
      color: var(--ok);
    }
    .option.wrong {
      border-color: transparent;
      background: var(--coral-soft);
      color: var(--bad);
    }
    .build-zone {
      display: grid;
      gap: 10px;
    }
    .answer-line {
      min-height: 58px;
      border: 1px dashed var(--line);
      background: var(--soft);
      border-radius: 16px;
      padding: 10px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .bank {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .bank-word, .selected-word, .word-chip {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      border-radius: 999px;
      min-height: 38px;
      padding: 8px 11px;
      font-size: 14px;
      font-weight: 850;
      cursor: pointer;
    }
    .bank-word[disabled] {
      opacity: .36;
      cursor: default;
    }
    .selected-word {
      background: var(--gold-soft);
      border-color: transparent;
      cursor: default;
    }
    .build-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .secondary {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      border-radius: 14px;
      min-height: 42px;
      padding: 0 14px;
      font-weight: 800;
      cursor: pointer;
    }
    .feedback {
      min-height: 46px;
      border-radius: 16px;
      padding: 12px;
      background: var(--ink-soft);
      color: var(--muted);
      line-height: 1.4;
      font-size: 14px;
    }
    .feedback.good {
      background: var(--teal-soft);
      color: var(--ok);
      font-weight: 800;
    }
    .feedback.bad {
      background: var(--coral-soft);
      color: var(--bad);
      font-weight: 800;
    }
    .support {
      display: grid;
      gap: 8px;
      border-top: 1px solid var(--line);
      padding: 12px 14px 14px;
      background: var(--soft-2);
    }
    .support-title {
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
    }
    .support-words {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .dictionary {
      display: grid;
      gap: 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 14px;
    }
    .dict-head {
      display: grid;
      gap: 8px;
    }
    .dict-title {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
    }
    .search {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      border-radius: 14px;
      min-height: 44px;
      padding: 0 12px;
      outline: none;
    }
    .word-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      max-height: 360px;
      overflow: auto;
      padding-right: 2px;
    }
    .word-card {
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 14px;
      padding: 10px;
      min-height: 72px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
    }
    .word-en {
      font-weight: 900;
      line-height: 1.2;
      word-break: break-word;
    }
    .word-ru {
      margin-top: 3px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.25;
    }
    .mini-play {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      border: 0;
      background: var(--teal-soft);
      color: var(--teal);
      cursor: pointer;
      font-weight: 900;
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%) translateY(18px);
      padding: 11px 15px;
      border-radius: 999px;
      background: rgba(17,24,39,.92);
      color: white;
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
      z-index: 80;
      font-weight: 800;
      max-width: calc(100vw - 24px);
      text-align: center;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    @media (max-width: 720px) {
      .wrap { padding: 10px 10px 28px; }
      .top { border-radius: 18px; }
      .topline { grid-template-columns: auto 1fr auto; align-items: start; }
      h1 { font-size: 20px; }
      .subline { font-size: 13px; }
      .stats { grid-template-columns: repeat(3, 1fr); gap: 6px; }
      .stat { padding: 9px; min-height: 58px; }
      .stat b { font-size: 16px; }
      .quiz-head { grid-template-columns: 1fr auto; padding: 12px; }
      .prompt { font-size: 21px; }
      .quiz-body { padding: 12px; }
      .options, .word-grid { grid-template-columns: 1fr; }
      .option { min-height: 54px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="topline">
        <a class="back" href="index.html" title="Назад">←</a>
        <div>
          <h1>Тренажер слов и фраз</h1>
          <div class="subline">7 уровней. Слова из гостиничных скриптов.</div>
        </div>
        <button class="iconbtn" type="button" id="themeBtn" title="Тема">☼</button>
      </div>
      <nav class="seg" id="levelTabs" aria-label="Уровни"></nav>
    </header>

    <section class="stats" aria-label="Прогресс">
      <div class="stat"><b id="scoreNow">0/0</b><span>Раунд</span></div>
      <div class="stat"><b id="streakNow">0</b><span>Серия</span></div>
      <div class="stat"><b id="bestNow">0</b><span>Лучшее</span></div>
    </section>

    <main class="trainer">
      <section class="quiz" aria-live="polite">
        <div class="quiz-head">
          <div>
            <p class="level-name" id="levelName">Уровень</p>
            <div class="prompt" id="prompt">...</div>
          </div>
          <button class="listen" type="button" id="listenBtn" title="Слушать">▶</button>
        </div>
        <div class="quiz-body">
          <div class="task" id="taskText"></div>
          <div class="options" id="options"></div>
          <div class="build-zone" id="buildZone" hidden>
            <div class="answer-line" id="answerLine"></div>
            <div class="bank" id="bank"></div>
            <div class="build-actions">
              <button class="secondary" type="button" id="clearBuild">Стереть</button>
              <button class="action" type="button" id="checkBuild">Проверить</button>
            </div>
          </div>
          <div class="feedback" id="feedback">Выберите ответ.</div>
          <div class="build-actions">
            <button class="action" type="button" id="nextBtn">Дальше</button>
            <button class="secondary" type="button" id="hintBtn">Подсказка</button>
          </div>
        </div>
        <div class="support">
          <div class="support-title">Опорные слова</div>
          <div class="support-words" id="supportWords"></div>
        </div>
      </section>

      <section class="dictionary">
        <div class="dict-head">
          <h2 class="dict-title">Словарь спасения</h2>
          <div class="seg" id="groupTabs" aria-label="Группы слов"></div>
          <input class="search" id="dictSearch" type="search" placeholder="Найти слово..." autocomplete="off" />
        </div>
        <div class="word-grid" id="wordGrid"></div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast">Audio not found</div>

  <script>
    const WORDS = [

      { ru: 'Нужен счет?', en: 'Do you need a bill?', parts: ['Do', 'you', 'need', 'a', 'bill'] },
      { ru: 'Вы будете платить картой?', en: 'Will you pay by card?', parts: ['Will', 'you', 'pay', 'by', 'card'] },
      { ru: 'Вам нужно такси?', en: 'Do you need a taxi?', parts: ['Do', 'you', 'need', 'a', 'taxi'] },
      { ru: 'Какой адрес?', en: 'What address?', parts: ['What', 'address'] },
      { ru: 'В какое время?', en: 'What time?', parts: ['What', 'time'] }
    ];

    const SCENARIOS = [
      { ru: 'Гость подошел к стойке.', en: 'How can I help you?' },
      { ru: 'Нужно узнать имя.', en: 'What is your name, please?' },
      { ru: 'Нужно проверить бронь.', en: 'Do you have a reservation?' },
      { ru: 'Нужно спросить даты.', en: 'What dates, please?' },
      { ru: 'Нужно узнать количество гостей.', en: 'How many people?' },
      { ru: 'Гость с ребенком.', en: 'How old is your child?' },
      { ru: 'Нужно попросить паспорт.', en: 'Your passport, please.' },
      { ru: 'Нужно попросить подпись.', en: 'Please sign here.' },
      { ru: 'Нужно отдать документы.', en: 'Here are your documents.' },
      { ru: 'Номер уже готов.', en: 'Your room is ready.' },
      { ru: 'Нужно сказать, где номер.', en: 'Your room is on the left.' },
      { ru: 'Гость спрашивает про завтрак.', en: 'Breakfast is served from 7 to 10.' },
      { ru: 'Нужно сказать про ресепшн.', en: 'The reception is open 24/7.' },
      { ru: 'Нужно предложить помощь с багажом.', en: 'Do you need help with your luggage?' },
      { ru: 'Разговор почти закончен.', en: 'Anything else?' },
      { ru: 'Нужно попрощаться.', en: 'Have a nice day!' },
      { ru: 'Гость выезжает и нужен ключ.', en: 'Can I see the key?' },
      { ru: 'Нужно спросить про счет.', en: 'Do you need a bill?' },
      { ru: 'Нужно узнать адрес для такси.', en: 'What address?' }
    ];

    const GROUPS = [
      { id: 'all', label: 'Все' },
      { id: 'start', label: 'Старт' },
      { id: 'checkin', label: 'Заезд' },
      { id: 'food', label: 'Еда' },
      { id: 'money', label: 'Деньги' },
      { id: 'place', label: 'Место' },
      { id: 'travel', label: 'Такси' }
    ];

    const LEVELS = [
      { id: 1, label: '1 Слово', name: 'Слово -> смысл', task: 'Выберите русский смысл.' },
      { id: 2, label: '2 Смысл', name: 'Смысл -> слово', task: 'Выберите английское слово.' },
      { id: 3, label: '3 Слух', name: 'Слух -> слово', task: 'Слушайте и выберите слово.' },
      { id: 4, label: '4 Кусок', name: 'Короткая фраза', task: 'Выберите готовый кусок фразы.' },
      { id: 5, label: '5 Собери', name: 'Сборка фразы', task: 'Соберите фразу из слов.' },
      { id: 6, label: '6 Пропуск', name: 'Пропущенное слово', task: 'Выберите слово для пропуска.' },
      { id: 7, label: '7 Экзамен', name: 'Экзамен-микс', task: 'Выберите, что сказать гостю.' }
    ];

    const ROUND_SIZE = 10;
    const WORD_INDEX = new Map(WORDS.map(item => [item.en.toLowerCase(), item]));
    const audio = new Audio();
    let toastTimer = null;
    let currentGroup = 'all';
    let currentQuestion = null;
    let selectedBuild = [];
    let locked = false;
    const state = {
      level: 1,
      answered: 0,
      correct: 0,
      streak: 0,
      best: JSON.parse(localStorage.getItem('phrase_trainer_best') || '{}')
    };

    const $ = (id) => document.getElementById(id);

    function cleanToken(value) {
      return String(value).toLowerCase().replace(/[^a-z0-9]+/g, '');
    }

    function normalizeAnswer(value) {
      return String(value).toLowerCase().replace(/[^a-z0-9а-яё]+/gi, '');
    }

    function shuffle(list) {
      const copy = [...list];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function sample(list) {
      return list[Math.floor(Math.random() * list.length)];
    }

    function choicesFrom(pool, answer, count = 4) {
      const cleanAnswer = normalizeAnswer(answer);
      const wrong = shuffle(pool.filter(item => normalizeAnswer(item) !== cleanAnswer)).slice(0, count - 1);
      return shuffle([answer, ...wrong]);
    }

    function showToast(text) {
      const toast = $('toast');
      toast.textContent = text;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1600);
    }

    function speakText(text) {
      audio.pause();
      if (!('speechSynthesis' in window)) {
        showToast('Audio is not available');
        return;
      }
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.82;
      window.speechSynthesis.speak(utterance);
    }

    function playWord(word) {
      const token = cleanToken(word);
      if (!token || !WORD_INDEX.has(token)) {
        speakText(word);
        return;
      }
      window.speechSynthesis?.cancel();
      audio.pause();
      audio.src = `../audio/words/${token}.mp3`;
      audio.currentTime = 0;
      audio.playbackRate = 1;
      audio.play().catch(() => speakText(word));
    }

    function setTheme(choice) {
      const picked = choice || localStorage.getItem('script_theme') || 'auto';
      const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const actual = picked === 'auto' ? (dark ? 'dark' : 'light') : picked;
      document.documentElement.setAttribute('data-theme', actual);
      $('themeBtn').textContent = actual === 'dark' ? '☾' : '☼';
    }

    function cycleTheme() {
      const current = localStorage.getItem('script_theme') || 'auto';
      const next = current === 'auto' ? 'light' : current === 'light' ? 'dark' : 'auto';
      localStorage.setItem('script_theme', next);
      setTheme(next);
      showToast(next === 'auto' ? 'Auto theme' : `${next} theme`);
    }

    function renderLevelTabs() {
      $('levelTabs').innerHTML = LEVELS.map(level => (
        `<button type="button" data-level="${level.id}" class="${level.id === state.level ? 'active' : ''}">${level.label}</button>`
      )).join('');
      $('levelTabs').querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', () => beginLevel(Number(btn.dataset.level)));
      });
    }

    function renderGroupTabs() {
      $('groupTabs').innerHTML = GROUPS.map(group => (
        `<button type="button" data-group="${group.id}" class="${group.id === currentGroup ? 'active' : ''}">${group.label}</button>`
      )).join('');
      $('groupTabs').querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', () => {
          currentGroup = btn.dataset.group;
          renderGroupTabs();
          renderDictionary();
        });
      });
    }

    function renderStats() {
      $('scoreNow').textContent = `${state.correct}/${state.answered}`;
      $('streakNow').textContent = state.streak;
      $('bestNow').textContent = state.best[state.level] || 0;
    }

    function updateBest() {
      const best = state.best[state.level] || 0;
      if (state.streak > best) {
        state.best[state.level] = state.streak;
        localStorage.setItem('phrase_trainer_best', JSON.stringify(state.best));
      }
    }

    function supportWordsFor(text) {
      const found = [];
      String(text).split(/\s+/).forEach(raw => {
        const token = cleanToken(raw);
        if (WORD_INDEX.has(token) && !found.includes(token)) found.push(token);
      });
      return found.slice(0, 14);
    }

    function renderSupport(text) {
      const words = supportWordsFor(text);
      $('supportWords').innerHTML = words.length ? words.map(token => {
        const item = WORD_INDEX.get(token);
        return `<button class="word-chip" type="button" data-word="${token}">${item.en} - ${item.ru}</button>`;
      }).join('') : '<span class="task">Нет отдельных слов.</span>';
      $('supportWords').querySelectorAll('[data-word]').forEach(btn => {
        btn.addEventListener('click', () => playWord(btn.dataset.word));
      });
    }

    function makeQuestion() {
      if (state.level === 1) {
        const item = sample(WORDS);
        return {
          type: 'choice',
          prompt: item.en,
          task: LEVELS[0].task,
          answer: item.ru,
          choices: choicesFrom(WORDS.map(w => w.ru), item.ru),
          audio: item.en,
          support: item.en
        };
      }
      if (state.level === 2) {
        const item = sample(WORDS);
        return {
          type: 'choice',
          prompt: item.ru,
          task: LEVELS[1].task,
          answer: item.en,
          choices: choicesFrom(WORDS.map(w => w.en), item.en),
          audio: item.en,
          support: item.en
        };
      }
      if (state.level === 3) {
        const item = sample(WORDS);
        return {
          type: 'choice',
          prompt: '▶',
          task: LEVELS[2].task,
          answer: item.en,
          choices: choicesFrom(WORDS.map(w => w.en), item.en),
          audio: item.en,
          support: item.en,
          autoListen: true
        };
      }
      if (state.level === 4) {
        const item = sample(PHRASES);
        return {
          type: 'choice',
          prompt: item.ru,
          task: LEVELS[3].task,
          answer: item.en,
          choices: choicesFrom(PHRASES.map(p => p.en), item.en),
          audioText: item.en,
          support: item.en
        };
      }
      if (state.level === 5) {
        const item = sample(PHRASES.filter(p => p.parts.length <= 7));
        const extra = shuffle(WORDS.map(w => w.en)).filter(w => !item.parts.some(part => cleanToken(part) === cleanToken(w))).slice(0, 3);
        return {
          type: 'build',
          prompt: item.ru,
          task: LEVELS[4].task,
          answer: item.parts.join(' '),
          target: item.parts,
          bank: shuffle([...item.parts, ...extra]),
          audioText: item.en,
          support: item.en
        };
      }
      if (state.level === 6) {
        const item = sample(PHRASES.filter(p => p.parts.some(part => WORD_INDEX.has(cleanToken(part)))));
        const candidates = item.parts.filter(part => WORD_INDEX.has(cleanToken(part)));
        const gap = sample(candidates);
        const blank = item.parts.map(part => part === gap ? '____' : part).join(' ');
        const pool = WORDS.map(w => w.en);
        return {
          type: 'choice',
          prompt: blank,
          task: LEVELS[5].task,
          answer: gap,
          choices: choicesFrom(pool, gap),
          audioText: item.en,
          support: item.en
        };
      }
      const item = sample(SCENARIOS);
      return {
        type: 'choice',
        prompt: item.ru,
        task: LEVELS[6].task,
        answer: item.en,
        choices: choicesFrom(PHRASES.map(p => p.en), item.en),
        audioText: item.en,
        support: item.en
      };
    }

    function beginLevel(level) {
      state.level = level;
      state.answered = 0;
      state.correct = 0;
      state.streak = 0;
      renderLevelTabs();
      renderStats();
      nextQuestion();
    }

    function nextQuestion() {
      if (state.answered >= ROUND_SIZE) {
        renderRoundEnd();
        return;
      }
      locked = false;
      selectedBuild = [];
      currentQuestion = makeQuestion();
      const level = LEVELS.find(item => item.id === state.level);
      $('levelName').textContent = level.name;
      $('prompt').textContent = currentQuestion.prompt;
      $('taskText').textContent = currentQuestion.task || level.task;
      $('feedback').className = 'feedback';
      $('feedback').textContent = 'Выберите ответ.';
      $('nextBtn').textContent = 'Дальше';
      $('nextBtn').disabled = true;
      $('options').hidden = currentQuestion.type === 'build';
      $('buildZone').hidden = currentQuestion.type !== 'build';
      renderSupport(currentQuestion.support || currentQuestion.answer || currentQuestion.prompt);
      if (currentQuestion.type === 'build') {
        renderBuild();
      } else {
        renderOptions(currentQuestion.choices);
      }
    }

    function renderRoundEnd() {
      locked = true;
      const percent = Math.round((state.correct / ROUND_SIZE) * 100);
      $('levelName').textContent = LEVELS.find(item => item.id === state.level).name;
      $('prompt').textContent = `${state.correct}/${ROUND_SIZE}`;
      $('taskText').textContent = percent >= 80 ? 'Раунд сдан.' : 'Еще один круг.';
      $('options').hidden = true;
      $('buildZone').hidden = true;
      $('feedback').className = percent >= 80 ? 'feedback good' : 'feedback bad';
      $('feedback').textContent = percent >= 80 ? 'Отлично. Можно идти дальше.' : 'Нормально. Повторение здесь работает лучше, чем зубрежка.';
      $('nextBtn').disabled = false;
      $('nextBtn').textContent = state.level < 7 ? 'Следующий уровень' : 'Повторить';
      renderSupport('');
    }

    function renderOptions(choices) {
      $('options').innerHTML = choices.map(choice => (
        `<button class="option" type="button" data-value="${escapeHtml(choice)}">${escapeHtml(choice)}</button>`
      )).join('');
      $('options').querySelectorAll('.option').forEach(btn => {
        btn.addEventListener('click', () => handleChoice(btn.dataset.value, btn));
      });
    }

    function renderBuild() {
      $('answerLine').innerHTML = selectedBuild.length ? selectedBuild.map(item => (
        `<span class="selected-word">${escapeHtml(item.word)}</span>`
      )).join('') : '<span class="task">...</span>';
      $('bank').innerHTML = currentQuestion.bank.map((word, index) => {
        const used = selectedBuild.some(item => item.index === index);
        return `<button class="bank-word" type="button" data-index="${index}" ${used ? 'disabled' : ''}>${escapeHtml(word)}</button>`;
      }).join('');
      $('bank').querySelectorAll('.bank-word').forEach(btn => {
        btn.addEventListener('click', () => {
          const index = Number(btn.dataset.index);
          selectedBuild.push({ index, word: currentQuestion.bank[index] });
          renderBuild();
        });
      });
    }

    function markAnswered(isCorrect, answerText) {
      locked = true;
      state.answered += 1;
      if (isCorrect) {
        state.correct += 1;
        state.streak += 1;
        $('feedback').className = 'feedback good';
        $('feedback').textContent = `Правильно: ${answerText}`;
      } else {
        state.streak = 0;
        $('feedback').className = 'feedback bad';
        $('feedback').textContent = `Правильно: ${answerText}`;
      }
      updateBest();
      renderStats();
      $('nextBtn').disabled = false;
      if (currentQuestion.audioText) speakText(currentQuestion.audioText);
      else if (currentQuestion.audio) playWord(currentQuestion.audio);
    }

    function handleChoice(value, btn) {
      if (locked) return;
      const isCorrect = normalizeAnswer(value) === normalizeAnswer(currentQuestion.answer);
      document.querySelectorAll('.option').forEach(option => {
        if (normalizeAnswer(option.dataset.value) === normalizeAnswer(currentQuestion.answer)) option.classList.add('correct');
      });
      if (!isCorrect) btn.classList.add('wrong');
      markAnswered(isCorrect, currentQuestion.answer);
    }

    function checkBuildAnswer() {
      if (locked || currentQuestion?.type !== 'build') return;
      const selected = selectedBuild.map(item => item.word).join(' ');
      const isCorrect = normalizeAnswer(selected) === normalizeAnswer(currentQuestion.answer);
      markAnswered(isCorrect, currentQuestion.answer);
    }

    function clearBuildAnswer() {
      if (locked) return;
      selectedBuild = [];
      renderBuild();
    }

    function showHint() {
      if (!currentQuestion) return;
      const text = currentQuestion.answer || currentQuestion.audioText || currentQuestion.support;
      $('feedback').className = 'feedback';
      $('feedback').textContent = `Подсказка: ${text}`;
      renderSupport(text);
      if (currentQuestion.audio) playWord(currentQuestion.audio);
      else speakText(text);
    }

    function playCurrent() {
      if (!currentQuestion) return;
      if (currentQuestion.audio) playWord(currentQuestion.audio);
      else speakText(currentQuestion.audioText || currentQuestion.answer || currentQuestion.prompt);
    }

    function renderDictionary() {
      const q = $('dictSearch').value.trim().toLowerCase();
      const list = WORDS.filter(item => {
        const groupOk = currentGroup === 'all' || item.group === currentGroup;
        const textOk = !q || item.en.includes(q) || item.ru.toLowerCase().includes(q);
        return groupOk && textOk;
      });
      $('wordGrid').innerHTML = list.map(item => (
        `<div class="word-card">
          <div>
            <div class="word-en">${escapeHtml(item.en)}</div>
            <div class="word-ru">${escapeHtml(item.ru)}</div>
          </div>
          <button class="mini-play" type="button" data-word="${escapeHtml(item.en)}" title="Слушать">▶</button>
        </div>`
      )).join('');
      $('wordGrid').querySelectorAll('[data-word]').forEach(btn => {
        btn.addEventListener('click', () => playWord(btn.dataset.word));
      });
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;');
    }

    $('themeBtn').addEventListener('click', cycleTheme);
    $('listenBtn').addEventListener('click', playCurrent);
    $('hintBtn').addEventListener('click', showHint);
    $('nextBtn').addEventListener('click', () => {
      if (state.answered >= ROUND_SIZE) {
        beginLevel(state.level < 7 ? state.level + 1 : 1);
      } else {
        nextQuestion();
      }
    });
    $('clearBuild').addEventListener('click', clearBuildAnswer);
    $('checkBuild').addEventListener('click', checkBuildAnswer);
    $('dictSearch').addEventListener('input', renderDictionary);

    const systemDark = window.matchMedia('(prefers-color-scheme: dark)');
    if (systemDark.addEventListener) systemDark.addEventListener('change', () => setTheme());
    setTheme();
    renderLevelTabs();
    renderGroupTabs();
    renderDictionary();
    beginLevel(1);
  </script>
</body>
</html>
