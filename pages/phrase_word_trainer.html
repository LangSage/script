<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Тренажер фраз для экзамена</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7f2;
      --panel: rgba(255,255,255,.88);
      --card: #ffffff;
      --soft: #f1f5ed;
      --soft-2: #fff5e8;
      --text: #17201d;
      --muted: #66726b;
      --line: rgba(23,32,29,.12);
      --teal: #1e8f7a;
      --teal-soft: #dff4ee;
      --coral: #d86c53;
      --coral-soft: #ffe5dd;
      --gold: #b8860b;
      --gold-soft: #fff1c7;
      --ink-soft: #eef1f4;
      --shadow: 0 14px 34px rgba(31, 42, 36, .09);
      --ok: #138a4d;
      --bad: #bd3d2a;
    }
    [data-theme="dark"] {
      --bg: #101513;
      --panel: rgba(22,30,27,.9);
      --card: #17201d;
      --soft: #1c2824;
      --soft-2: #2a241e;
      --text: #eef7f2;
      --muted: #a7b6ad;
      --line: rgba(238,247,242,.13);
      --teal: #71dcc6;
      --teal-soft: rgba(113,220,198,.15);
      --coral: #ff987d;
      --coral-soft: rgba(255,152,125,.16);
      --gold: #ffd36b;
      --gold-soft: rgba(255,211,107,.15);
      --ink-soft: #202b28;
      --shadow: 0 16px 38px rgba(0,0,0,.28);
      --ok: #68d391;
      --bad: #ff8a78;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    }
    button, input {
      font: inherit;
    }
    .wrap {
      width: min(100%, 980px);
      margin: 0 auto;
      padding: 12px 12px 36px;
    }
    .top {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      gap: 12px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    .topline {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 10px;
    }
    .back, .iconbtn, .action {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      border-radius: 14px;
      min-height: 42px;
      cursor: pointer;
      text-decoration: none;
      display: inline-grid;
      place-items: center;
      font-weight: 800;
    }
    .back {
      min-width: 42px;
      padding: 0 12px;
    }
    .iconbtn {
      min-width: 42px;
      padding: 0 10px;
    }
    .action {
      padding: 0 14px;
      background: var(--teal);
      border-color: transparent;
      color: white;
    }
    [data-theme="dark"] .action {
      color: #07110e;
    }
    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.15;
      letter-spacing: 0;
    }
    .subline {
      margin-top: 2px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.35;
    }
    .seg {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 1px;
      scrollbar-width: none;
    }
    .seg::-webkit-scrollbar { display: none; }
    .seg button {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      border-radius: 999px;
      padding: 9px 12px;
      min-height: 40px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }
    .seg button.active {
      background: var(--teal);
      color: white;
      border-color: transparent;
    }
    [data-theme="dark"] .seg button.active {
      color: #07110e;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 12px 0;
    }
    .stat {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 10px 12px;
      min-height: 62px;
    }
    .stat b {
      display: block;
      font-size: 18px;
      line-height: 1.15;
    }
    .stat span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }
    .trainer {
      display: grid;
      gap: 12px;
      margin-top: 12px;
    }
    .quiz {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .quiz-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 14px;
      border-bottom: 1px solid var(--line);
      background: var(--soft);
    }
    .level-name {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0;
    }
    .prompt {
      margin: 4px 0 0;
      font-size: 24px;
      line-height: 1.25;
      font-weight: 900;
      word-break: break-word;
    }
    .listen {
      width: 46px;
      height: 46px;
      border-radius: 15px;
      border: 0;
      background: var(--coral);
      color: #fff;
      font-size: 18px;
      cursor: pointer;
    }
    .quiz-body {
      display: grid;
      gap: 12px;
      padding: 14px;
    }
    .task {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
      min-height: 20px;
    }
    .word-peek {
      display: grid;
      gap: 3px;
      min-height: 54px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--soft);
      padding: 10px 12px;
    }
    .word-peek b {
      font-size: 15px;
      line-height: 1.2;
    }
    .word-peek span {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.25;
    }
    .click-word {
      display: inline;
      border-radius: 9px;
      padding: 0 .06em;
      color: inherit;
      cursor: pointer;
      text-decoration: underline;
      text-decoration-style: dotted;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }
    .click-word:hover,
    .click-word:active {
      background: var(--teal-soft);
      color: var(--teal);
    }
    .options {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .option {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      border-radius: 16px;
      min-height: 58px;
      padding: 12px;
      text-align: left;
      cursor: pointer;
      font-weight: 800;
      line-height: 1.25;
      word-break: break-word;
    }
    .option:hover, .word-chip:hover, .bank-word:hover {
      border-color: var(--teal);
    }
    .option.correct {
      border-color: transparent;
      background: var(--teal-soft);
      color: var(--ok);
    }
    .option.wrong {
      border-color: transparent;
      background: var(--coral-soft);
      color: var(--bad);
    }
    .build-zone {
      display: grid;
      gap: 10px;
    }
    .answer-line {
      min-height: 58px;
      border: 1px dashed var(--line);
      background: var(--soft);
      border-radius: 16px;
      padding: 10px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .bank {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .bank-word, .selected-word, .word-chip {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      border-radius: 999px;
      min-height: 38px;
      padding: 8px 11px;
      font-size: 14px;
      font-weight: 850;
      cursor: pointer;
    }
    .bank-word[disabled] {
      opacity: .36;
      cursor: default;
    }
    .selected-word {
      background: var(--gold-soft);
      border-color: transparent;
      cursor: default;
    }
    .build-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .secondary {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      border-radius: 14px;
      min-height: 42px;
      padding: 0 14px;
      font-weight: 800;
      cursor: pointer;
    }
    .feedback {
      min-height: 46px;
      border-radius: 16px;
      padding: 12px;
      background: var(--ink-soft);
      color: var(--muted);
      line-height: 1.4;
      font-size: 14px;
    }
    .feedback.good {
      background: var(--teal-soft);
      color: var(--ok);
      font-weight: 800;
    }
    .feedback.bad {
      background: var(--coral-soft);
      color: var(--bad);
      font-weight: 800;
    }
    .support {
      display: grid;
      gap: 8px;
      border-top: 1px solid var(--line);
      padding: 12px 14px 14px;
      background: var(--soft-2);
    }
    .support-title {
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
    }
    .support-words {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .dictionary {
      display: grid;
      gap: 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 14px;
    }
    .dict-head {
      display: grid;
      gap: 8px;
    }
    .dict-title {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
    }
    .search {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      border-radius: 14px;
      min-height: 44px;
      padding: 0 12px;
      outline: none;
    }
    .word-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      max-height: 360px;
      overflow: auto;
      padding-right: 2px;
    }
    .word-card {
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 14px;
      padding: 10px;
      min-height: 72px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
    }
    .word-en {
      font-weight: 900;
      line-height: 1.2;
      word-break: break-word;
    }
    .word-ru {
      margin-top: 3px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.25;
    }
    .mini-play {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      border: 0;
      background: var(--teal-soft);
      color: var(--teal);
      cursor: pointer;
      font-weight: 900;
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%) translateY(18px);
      padding: 11px 15px;
      border-radius: 999px;
      background: rgba(17,24,39,.92);
      color: white;
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
      z-index: 80;
      font-weight: 800;
      max-width: calc(100vw - 24px);
      text-align: center;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    @media (max-width: 720px) {
      .wrap { padding: 10px 10px 28px; }
      .top { border-radius: 18px; }
      .topline { grid-template-columns: auto 1fr auto; align-items: start; }
      h1 { font-size: 20px; }
      .subline { font-size: 13px; }
      .stats { grid-template-columns: repeat(3, 1fr); gap: 6px; }
      .stat { padding: 9px; min-height: 58px; }
      .stat b { font-size: 16px; }
      .quiz-head { grid-template-columns: 1fr auto; padding: 12px; }
      .prompt { font-size: 21px; }
      .quiz-body { padding: 12px; }
      .options, .word-grid { grid-template-columns: 1fr; }
      .option { min-height: 54px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="topline">
        <a class="back" href="index.html" title="Назад">←</a>
        <div>
          <h1>Тренажер фраз для экзамена</h1>
          <div class="subline">Только 3 рабочих режима: собрать, закрыть пропуск, выбрать реплику.</div>
        </div>
        <button class="iconbtn" type="button" id="themeBtn" title="Тема">☼</button>
      </div>
      <nav class="seg" id="levelTabs" aria-label="Уровни"></nav>
    </header>

    <section class="stats" aria-label="Прогресс">
      <div class="stat"><b id="scoreNow">0/0</b><span>Раунд</span></div>
      <div class="stat"><b id="streakNow">0</b><span>Серия</span></div>
      <div class="stat"><b id="bestNow">0</b><span>Лучшее</span></div>
    </section>

    <main class="trainer">
      <section class="quiz" aria-live="polite">
        <div class="quiz-head">
          <div>
            <p class="level-name" id="levelName">Уровень</p>
            <div class="prompt" id="prompt">...</div>
          </div>
          <button class="listen" type="button" id="listenBtn" title="Слушать">▶</button>
        </div>
        <div class="quiz-body">
          <div class="task" id="taskText"></div>
          <div class="word-peek" id="wordPeek"><b>Нажми на слово</b><span>перевод и звук появятся здесь</span></div>
          <div class="options" id="options"></div>
          <div class="build-zone" id="buildZone" hidden>
            <div class="answer-line" id="answerLine"></div>
            <div class="bank" id="bank"></div>
            <div class="build-actions">
              <button class="secondary" type="button" id="clearBuild">Стереть</button>
              <button class="action" type="button" id="checkBuild">Проверить</button>
            </div>
          </div>
          <div class="feedback" id="feedback">Выберите ответ.</div>
          <div class="build-actions">
            <button class="action" type="button" id="nextBtn">Дальше</button>
            <button class="secondary" type="button" id="hintBtn">Подсказка</button>
          </div>
        </div>
        <div class="support">
          <div class="support-title">Опорные слова</div>
          <div class="support-words" id="supportWords"></div>
        </div>
      </section>

      <section class="dictionary">
        <div class="dict-head">
          <h2 class="dict-title">Словарь спасения</h2>
          <input class="search" id="dictSearch" type="search" placeholder="Найти слово..." autocomplete="off" />
        </div>
        <div class="word-grid" id="wordGrid"></div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast">Audio not found</div>

  <script src="words.js"></script>
  <script src="words_extra.js"></script>
  <script src="phrase_word_trainer.js"></script>
</body>
</html>
